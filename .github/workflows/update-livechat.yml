name: Update LiveChat data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (GitHub may run it a little late)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch LiveChat tag counts
        env:
          LIVECHAT_ACCOUNT_ID: ${{ secrets.LIVECHAT_ACCOUNT_ID }}
          LIVECHAT_TOKEN: ${{ secrets.LIVECHAT_TOKEN }}
        run: node scripts/fetch-livechat.js

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/livechat.json
          git diff --staged --quiet || git commit -m "Update LiveChat data"
          git push
